[project]
name = "tinek-invest"
version = "0.1.0"
description = "Telegram bot for T-Invest bond portfolio management"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.15.0",
    "aiohttp>=3.10.0",
    "apscheduler>=3.10.0",
    "asyncpg>=0.29.0",
    "certifi>=2024.0.0",
    "greenlet>=3.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "ruff>=0.15.13",
    "sqlalchemy>=2.0.0",
    "t-tech-investments>=0.3.5",
    "watchfiles>=1.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "aiosqlite>=0.20.0",
]

[[tool.uv.index]]
url = "https://opensource.tbank.ru/api/v4/projects/238/packages/pypi/simple"
name = "tbank"

[tool.uv.sources]
t-tech-investments = { index = "tbank" }

[tool.pytest.ini_options]
pythonpath = ["app"]
asyncio_mode = "auto"
testpaths = ["tests"]
